#
# What this catches, and what it does not.
#
# The engine had never been built on Linux until it was tried by hand, and
# two defects fell out immediately: the Makefile picked up the NEON
# translation unit only when `uname -m` contained "arm" — Linux on aarch64
# says "aarch64" — so the link failed on an undefined symbol; and the RAM
# check measured peak RSS with a BSD-only flag of a tool debian does not
# install. Both were invisible from macOS. This matrix exists so the next
# one is not.
#
# It cannot run the end-to-end engine checks against real weights: those
# need a real container, and the smallest is 19 GB. What it does run is
# every check that is independent of one — the build on four targets, and
# the kernels against their PyTorch references, which is what would catch
# a numerical regression in SiTU, the decay gates, AttnRes or KDA on a
# platform nobody develops on.
#
# Windows is the fourth, and it is two jobs rather than one because the
# toolchain and the OS are in different places: MinGW-w64 is an apt
# package on the Linux runner, and the only machine that can say whether
# FILE_FLAG_NO_BUFFERING and the ReadFile offsets behave is a Windows
# one. Cross-build there, run here.

name: CI

on:
  push:
    branches: [main, spark/integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The SIMD line is not decoration. AVX-512 compiles and dispatches
      # here and has never executed: no machine we own has it, and it
      # cannot be emulated on the development laptop — Docker on Apple
      # silicon runs x86 through Rosetta, which reports AVX2 and leaves
      # the opmask and ZMM bits clear in XCR0. A hosted runner is the
      # cheapest hardware that might have it, so ask, and let the backend
      # line below say what the engine then chose.
      #
      # The answer so far is no. The x86 runner is an AMD EPYC 7763, which
      # answers avx512f/bw/dq/vl: no, and `waste version` on it says
      # backend AVX2 — so the AVX-512 kernels are still compiled, linked
      # and never entered. This step exists so that the day a runner does
      # have them, the *SIMD backend matches the CPU baseline* check
      # becomes the confirmation without anyone arranging it. Do not read
      # that check passing as evidence about AVX-512: it passes on
      # whichever backend dispatch actually chose.
      - name: Toolchain and architecture
        run: |
          uname -m
          cc --version | head -1
          make --version | head -1
          if [ -r /proc/cpuinfo ]; then
            model=$(grep -m1 'model name' /proc/cpuinfo || true)
            echo "${model:-cpu model unknown}"
            for f in avx2 avx512f avx512bw avx512dq avx512vl; do
              grep -qw "$f" /proc/cpuinfo && echo "  $f: yes" || echo "  $f: no"
            done
          fi

      - name: Build
        run: make

      - name: Build the checkers
        run: make test

      - name: Report the backend this machine selected
        run: ./waste version

      # The official installer rather than a third-party action, so the
      # workflow does not depend on an action tag moving under it.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Model-independent: the kernels against their PyTorch references.
      # tests/run.sh skips everything that needs a container and exits 0.
      - name: Tests
        run: tests/run.sh /nonexistent-container

  metal:
    name: macos-arm64 (Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The Metal backend is off by default and would otherwise never be
      # compiled anywhere. It is Objective-C against two frameworks, so it
      # breaks in ways the C build does not.
      - name: Build with Metal
        run: make WASTE_ENABLE_METAL=1
      - name: The backend registers
        run: ./waste version | grep -q Metal

  sanitizers:
    name: asan + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both run against the synthetic container, so neither needs a model.
      # The fuzzer is where this pays: every finding so far came from it,
      # and only the instrumented build turns them into failures instead of
      # plausible garbage.
      - name: Suite under ASan/UBSan
        run: make asan
      - name: Fuzz the container parser under ASan/UBSan
        run: make fuzz-asan FUZZ_RUNS=400

  # Windows is built where the toolchain is an apt package and run where
  # the OS is real. Cross-compiling on Linux keeps the build reproducible
  # and fast; it also proves nothing by itself, which is what the second
  # job is for — FILE_FLAG_NO_BUFFERING, the ReadFile offsets and
  # _aligned_malloc either work on Windows or they do not, and a link is
  # not evidence either way.
  #
  # This replaced a tripwire that counted unresolved POSIX calls without
  # linking. The build is now the tripwire: a fourth POSIX dependency
  # fails it, and so does everything the old job could not see.
  windows-build:
    name: windows-x86_64 (cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The -posix variant by name, not the bare triplet. Debian ships the
      # two threading models as separate compilers and the bare name is an
      # alternatives symlink to whichever was installed last; only -posix
      # has pthread.h, and threads.h needs it. Naming it means this job
      # cannot start depending on which package won that race.
      - name: MinGW cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              gcc-mingw-w64-x86-64-posix
          x86_64-w64-mingw32-gcc-posix --version | head -1
          x86_64-w64-mingw32-gcc-posix -dumpmachine

      # CC alone is enough: the Makefile takes the architecture from the
      # compiler's target triple, so this picks the two x86 SIMD units and
      # the matching archiver rather than the host's.
      - name: Build
        run: make CC=x86_64-w64-mingw32-gcc-posix

      - name: Build the checkers
        run: make test CC=x86_64-w64-mingw32-gcc-posix

      - name: It is actually a Windows binary
        run: |
          file waste.exe libwaste.dll
          file waste.exe | grep -q "PE32+ executable"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            waste.exe
            test_*.exe
            libwaste.dll
            libwastevq.dll
          if-no-files-found: error
          retention-days: 7

  windows-run:
    name: windows-x86_64 (run)
    runs-on: windows-latest
    needs: windows-build
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Which SIMD backend CPUID picked here. The Linux job asks the same
      # question of /proc/cpuinfo; this is the only place the answer comes
      # from a Windows CPUID path.
      - name: The backend this machine selected
        run: ./waste.exe version

      # The synthetic container is a few megabytes of deterministic noise
      # in the real format, and it is the whole reason this job can test
      # anything: the smallest real container is 19 GB. It exercises every
      # call this port had to write — the bypassed open, positional reads
      # at 4 KiB offsets, and the aligned buffers both of those require.
      - name: A container to read
        run: python tools/make_test_container.py tiny.waste

      # One bank per call: the record count is the second argument, so a
      # glob passed whole puts a filename where a number goes and the
      # checker reads nothing while reporting no problems.
      - name: Expert records read through the C structs
        run: |
          for bank in tiny.waste/experts-L*.bin; do
            out=$(./test_container.exe "$bank" 2)
            echo "$out" | tail -1
            echo "$out" | grep -qE "^[1-9][0-9]* records read, 0 problems$"
          done

      - name: The CLI opens it
        run: |
          ./waste.exe info tiny.waste
          ./waste.exe plan tiny.waste

      # The forward pass, twice: one token at a time and in chunks. They
      # read the same expert records through the same cache, so agreement
      # is the evidence that the streaming read path works here and not
      # merely that it linked.
      - name: Forward pass, sequential vs chunked
        run: |
          IDS=3,7,11,5,9,13,2,17,4,8,19,23,6,29,12,31
          ./test_forward.exe tiny.waste "$IDS" seq.bin 0
          WASTE_CHUNK=1 ./test_forward.exe tiny.waste "$IDS" chunk.bin 0
          python - seq.bin chunk.bin <<'PY'
          import struct, sys
          def L(p):
              b = open(p, "rb").read()
              return struct.unpack(f"<{len(b)//4}f", b)
          a, b = L(sys.argv[1]), L(sys.argv[2])
          d = max(abs(x - y) for x, y in zip(a, b))
          print(f"max |seq - chunked| = {d:.3e}")
          sys.exit(0 if d < 1e-3 and a.index(max(a)) == b.index(max(b)) else 1)
          PY

      # The bypass is the reason the hit rates in docs/GATES.md mean
      # anything, and FILE_FLAG_NO_BUFFERING is the piece of this port with
      # no fallback that preserves them. The engine reports per run whether
      # it got it, so ask rather than assume. A warning and not a failure:
      # a filesystem is allowed to refuse, and the runner's is not the one
      # anybody will run K3 on.
      - name: The page-cache bypass engaged
        run: |
          out=$(./waste.exe bench tiny.waste -n 1 --json | tail -1)
          echo "$out"
          if echo "$out" | grep -q '"direct_io":true'; then
            echo "FILE_FLAG_NO_BUFFERING accepted"
          else
            echo "::warning::this filesystem refused FILE_FLAG_NO_BUFFERING"
          fi

  guards:
    name: build guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flags with no implementation must fail early. CUDA is implemented
      # experimentally but this runner has no toolkit/GPU, so dry-run its
      # wiring instead of pretending the source should not exist.
      - name: Backend build guards
        run: |
          if make WASTE_ENABLE_BLAS=1 2>&1 | grep -q "is not implemented"; then
            echo "ok: WASTE_ENABLE_BLAS stops with a message"
          else
            echo "FAIL: WASTE_ENABLE_BLAS did not refuse cleanly"; exit 1
          fi
          make clean >/dev/null
          if make -n WASTE_ENABLE_CUDA=1 test_forward | grep -q 'src/cuda.cu'; then
            echo "ok: WASTE_ENABLE_CUDA wires the CUDA translation unit"
          else
            echo "FAIL: CUDA source is not wired into the build"; exit 1
          fi

      # Every source file carries the licence header.
      - name: SPDX headers
        run: |
          missing=$(git ls-files 'src/*.c' 'src/*.cu' 'src/*.h' 'src/*.m' 'cli/*.c' \
                                'tests/*.c' 'tools/*.py' 'tools/*.sh' \
                    | xargs grep -L 'SPDX-License-Identifier' || true)
          if [ -n "$missing" ]; then
            echo "missing SPDX header:"; echo "$missing"; exit 1
          fi
          echo "ok: all source files carry the header"

  # The cross-build job proves the code compiles for Windows and the run job
  # proves those binaries execute. Neither builds *on* Windows, so neither
  # ever ran the Makefile's platform detection, the shell harness, or the
  # Python checkers there — which is where all four defects in issue #3
  # were, and why a contributor had to find them by hand. This job is the
  # missing half: a native toolchain, the default compiler variable, and the
  # whole suite.
  windows-native:
    name: windows-x86_64 (native build + suite)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # MINGW64 rather than MSYS: its python is a native Windows build, so
      # it has no os.sysconf and does not resolve `./waste` to waste.exe —
      # the two things gaps 3 and 4 of #3 depend on. An MSYS python would
      # paper over both and this job would pass while the bug survived.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python
            make
            curl
            diffutils
            file

      - name: What this runner has
        run: |
          uname -s
          gcc -dumpmachine
          make --version | head -1
          python3 --version
          command -v cc >/dev/null && echo "cc: present" || echo "cc: absent (expected on MinGW)"

      # No CC= on purpose. `cc` does not exist here, and the Makefile used to
      # let that pass silently: -dumpmachine answered nothing, ARCH fell back
      # to `uname -m`, and a build for Windows was configured as if for Linux.
      - name: Build with the default compiler variable
        run: make -j4

      # MSYS2 ships a cc symlink, so the runner is friendlier than the stock
      # MinGW-w64 install in #3 — and the defect only appears when cc is
      # missing. Make the runner look like the machine that found it, or
      # this job would guard everything except the thing it was added for.
      - name: Build again with no cc on PATH, as stock MinGW has none
        run: |
          ccp="$(command -v cc)"
          echo "hiding $ccp"
          mv "$ccp" "$ccp.hidden"
          make clean >/dev/null
          make -j4
          mv "$ccp.hidden" "$ccp"

      - name: Build the checkers
        run: make test -j4

      - name: It really is a Windows binary
        run: |
          file waste.exe libwaste.dll
          file waste.exe | grep -q "PE32+ executable"

      # The whole harness, not a hand-picked subset: SOEXT from `uname -s`,
      # the .exe-suffixed checkers, and every Python block that shells out.
      - name: Suite
        run: bash tests/run.sh
